# Producción (Dokploy): `docker compose -f compose.yaml up -d --build`. La app queda en el puerto ${APP_PORT:-3100}.
# Sin `-f`, compose añade compose.override.yaml, que publica PostgreSQL solo para desarrollo.
# Las variables salen de .env (ver .env.example).

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-presupuestos}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-presupuestos}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-presupuestos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-presupuestos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build: { context: ., target: migrate }
    environment: *database-url
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  app:
    build: { context: ., target: runtime }
    restart: unless-stopped
    environment:
      <<: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Define BETTER_AUTH_URL en .env}
      BETTER_AUTH_COOKIE_PREFIX: ${BETTER_AUTH_COOKIE_PREFIX:-better-auth}
      # «beta» añade la etiqueta a la versión (entorno de pruebas); producción lo deja vacío.
      APP_CHANNEL: ${APP_CHANNEL:-}
      DATA_DIR: /data
    volumes:
      - appdata:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Acceso por IP y puerto, sin Traefik delante: el 3000 del servidor lo usa el panel de Dokploy.
    ports:
      - "${APP_PORT:-3100}:3000"
    # Límite sugerido (Chromium incluido); lo decide quien despliega.
    # mem_limit: 1g
    networks: [internal]

  # Copia diaria a las 02:00 de la base de datos y de appdata en ${BACKUP_DIR}; conserva 30 de cada.
  # Copia al momento: `docker compose exec backup /scripts/backup.sh now`. Restaurar: ver scripts/restore.sh.
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-presupuestos}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:-presupuestos}
    volumes:
      - appdata:/data:ro
      - ${BACKUP_DIR:-/srv/presupuestos-backups}:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/restore.sh:/scripts/restore.sh:ro
    command: /scripts/backup.sh loop
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

volumes:
  pgdata:
  appdata:

networks:
  internal:
