<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · ISF Presupuestos</title><link rel="stylesheet" href="isf.css">
<style>
body{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.side{background:var(--green);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.side .brand{padding:0;font-size:56px}
.side .brand small{font-size:13px}
.side p{color:var(--green-ink);max-width:40ch;font-size:15px}
.one{display:flex;align-items:center;gap:0;margin:40px 0}
.one .node{width:56px;height:56px;border:2px solid #fff;display:grid;place-items:center;font-weight:800;flex:none}
.one .node.m{border-radius:50%}
.one .w{flex:1;height:2px;background:#fff;position:relative}
.one .w span{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;white-space:nowrap}
.form{display:flex;align-items:center;justify-content:center;padding:40px}
.form form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.form .field input{width:100%}
.err{background:#fbe8e6;color:var(--red);padding:10px 12px;font-weight:600;font-size:13px}
@media (max-width:900px){body{grid-template-columns:1fr}.side{padding:28px}.one{display:none}}
</style></head><body>
<div class="side">
 <div class="brand">ISF<small>INSTALACIONES ELÉCTRICAS · AUTOMATIZACIÓN Y CONTROL</small></div>
 <div class="one" aria-hidden="true"><div class="node">CG</div><div class="w"><span>Catálogo → Cliente → Presupuesto</span></div><div class="node m">PDF</div></div>
 <p>Herramienta interna de presupuestos. Acceso solo desde la red de la oficina.</p>
</div>
<div class="form">
 <form>
  <h1 style="font-size:34px">Entrar</h1>
  <p class="err" role="alert">Email o contraseña incorrectos.</p>
  <label class="field">Email<input type="email" value="m.ortega@isf-esp.com" autocomplete="username"></label>
  <label class="field">Contraseña<input type="password" value="xxxxxxxxxx" autocomplete="current-password"></label>
  <button class="btn pri" style="justify-content:center;min-height:46px;font-size:15px">Entrar</button>
  <p class="mut" style="font-size:13px">¿Has olvidado la contraseña? Pide a un administrador que te la restablezca.</p>
 </form>
</div>
</body></html>
